version: 2

models:
  - name: mart_daily_weather
    description: "Daily weather fact table for all 5 retail markets. Foundation for all downstream analysis."
    columns:
      - name: city_name
        tests:
          - not_null
      - name: full_date
        tests:
          - not_null

  - name: mart_city_monthly
    description: "Monthly weather aggregates per city. Tracks temperature, precipitation, and retail-impact day counts."
    columns:
      - name: city_name
        tests:
          - not_null
      - name: month_name
        tests:
          - not_null

  - name: mart_weather_alerts
    description: "Days flagged as high retail weather impact. Scored by number of concurrent alert conditions."
    columns:
      - name: alert_score
        description: "Count of active alert conditions (0-4). Higher = more retail impact."
        tests:
          - not_null
