name: dbt CI

on:
  pull_request:
    branches:
      - main

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write BigQuery credentials file
        run: |
          echo '${{ secrets.BIGQUERY_CREDENTIALS }}' > /tmp/keyfile.json

      - name: Run dbt build
        env:
          BIGQUERY_KEYFILE_PATH: /tmp/keyfile.json
        run: dbt build --project-dir dbt
